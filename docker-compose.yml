# Sistema de matrícula self-healing
# Levantar:  docker compose up --build
# Escalar:   docker compose up -d --scale courses=2
# Apagar:    docker compose down        (agrega -v para borrar y recargar la BD)
#
# Monitoreo:  Grafana    http://localhost:3000   (admin / admin)
#             Prometheus http://localhost:9090
#             cAdvisor   http://localhost:8081

name: self-healing-matricula   # fija el nombre del proyecto (prefijo de los contenedores)

# ---------- Bloques reutilizables ----------
x-app: &app
  build: ./services            # una sola imagen; SERVICE_NAME elige qué servicio corre
  restart: "no"                # a propósito: quien repara es nuestro healer, no Docker
  cap_add:
    - NET_ADMIN                # permite al chaos-injector agregar latencia con tc netem
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
    interval: 5s
    timeout: 2s
    retries: 3
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 256M

x-db-env: &db-env
  DB_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

services:
  # ---------- Base de datos: 1 PostgreSQL, una base por servicio ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Por TCP y sobre la última tabla creada: así no queda "sano" a mitad de la carga inicial.
      test: ["CMD-SHELL", "PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U $${POSTGRES_USER} -d enrollment_db -c 'SELECT 1 FROM enrollments LIMIT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------- Microservicios ----------
  students:
    <<: *app
    environment:
      <<: *db-env
      SERVICE_NAME: students
      DB_NAME: students_db
    depends_on:
      postgres:
        condition: service_healthy

  courses:
    <<: *app
    environment:
      <<: *db-env
      SERVICE_NAME: courses
      DB_NAME: courses_db
    depends_on:
      postgres:
        condition: service_healthy

  billing:
    <<: *app
    environment:
      SERVICE_NAME: billing
      BASE_LATENCY_MS: 50
      JITTER_MS: 30

  enrollment:
    <<: *app
    environment:
      <<: *db-env
      SERVICE_NAME: enrollment
      DB_NAME: enrollment_db
      UPSTREAM_TIMEOUT_MS: 2000
      UPSTREAM_RETRIES: 2
    depends_on:
      postgres:
        condition: service_healthy
      students:
        condition: service_started
      courses:
        condition: service_started
      billing:
        condition: service_started

  gateway:
    <<: *app
    environment:
      SERVICE_NAME: gateway
      UPSTREAM_TIMEOUT_MS: 5000
    ports:
      - "8080:3000"            # única puerta de entrada desde tu computadora
    deploy:
      resources:
        limits:
          cpus: "1.0"          # más CPU que el resto: el cuello de botella debe ser courses, no la puerta
          memory: 256M
    depends_on:
      - students
      - courses
      - enrollment
      - billing

  # =====================================================================
  # Tráfico de estudiantes (F4). Solo arranca con:  docker compose --profile load up -d
  # =====================================================================
  locust:
    image: locustio/locust:latest
    profiles: ["load"]
    volumes:
      - ./load:/mnt/locust:ro
    command: >
      -f /mnt/locust/locustfile.py --headless
      -u ${LOCUST_USERS:-20} -r 5
      --host http://gateway:3000
      --only-summary
      EstudianteNormal
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # =====================================================================
  # Observabilidad (F3)
  # =====================================================================
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d    # guarda 30 días: es tu dataset
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,advtcp,memory_numa
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/matricula.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pgdata:
  promdata:
  grafanadata:
